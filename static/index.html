<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelBus | Premium Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">IntelBus</div>
    </header>

    <main class="app-container">
        <!-- Step 1: Search Form -->
        <section class="search-section">
            <h2>Where are you traveling?</h2>
            <div class="search-grid">
                <div class="input-group">
                    <label>Route</label>
                    <select id="route-select" onchange="searchBuses()">
                        <option value="">Loading...</option>
                    </select>
                </div>
            </div>
            
            <div id="date-tabs" class="date-tabs">
                <!-- Dates populated by JS -->
            </div>
        </section>

        <!-- Step 2: Bus Results -->
        <section id="results-section" class="hidden">
            <div id="bus-list" class="bus-list">
                <!-- Buses populated by JS -->
            </div>
        </section>

        <!-- Step 3: Seat Map Modal -->
        <div id="seatmap-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="seatmap-header">Select Seat</h2>
                    <button class="close-btn" onclick="closeSeatMap()">&times;</button>
                </div>
                
                <div class="modal-body">
                    <!-- Left: The physical bus -->
                    <div class="seatmap-area">
                        <div class="legend">
                            <div class="legend-item"><div class="legend-box available"></div> Available</div>
                            <div class="legend-item"><div class="legend-box sold"></div> Sold</div>
                            <div class="legend-item"><div class="legend-box ladies"></div> Ladies</div>
                            <div class="legend-item"><div class="legend-box selected"></div> Selected</div>
                            <div class="legend-item"><div class="legend-box cheapest"></div> Cheapest</div>
                        </div>
                        
                        <div class="deck-selector" id="deck-selector">
                            <button class="deck-btn active" id="btn-lower" onclick="switchDeck('Lower')">Lower Deck</button>
                            <button class="deck-btn" id="btn-upper" onclick="switchDeck('Upper')">Upper Deck</button>
                        </div>

                        <!-- CSS Grid populated via JS -->
                        <div id="bus-layout-lower" class="bus-layout">
                            <div class="bus-front"></div>
                        </div>
                        <div id="bus-layout-upper" class="bus-layout hidden"></div>
                    </div>
                    
                    <!-- Right: The intelligence panel -->
                    <div class="intel-area">
                        <div id="intelligence-panel" class="intel-card hidden">
                            <h3 class="intel-title">Selected Seat: <span id="intel-seat-no"></span></h3>
                            
                            <div style="margin-bottom: 2rem;">
                                <div class="intel-sub">Current Fare</div>
                                <div class="intel-value" id="intel-current-fare"></div>
                            </div>
                            
                            <div id="intel-recommendation-box" class="rec-badge"></div>
                            
                            <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                                <div>
                                    <div class="intel-sub">Historical Minimum</div>
                                    <div class="intel-value" id="intel-hist-min" style="font-size: 1.25rem;"></div>
                                </div>
                                
                                <div>
                                    <div class="intel-sub">Price Drop Probability</div>
                                    <div class="intel-value" id="intel-prob" style="font-size: 1.25rem;"></div>
                                </div>
                                
                                <div>
                                    <div class="intel-sub">Best Booking Window</div>
                                    <div class="intel-value" id="intel-window" style="font-size: 1.2rem;"></div>
                                </div>

                                <div>
                                    <div class="intel-sub">Intelligence Confidence</div>
                                    <div class="intel-value" id="intel-confidence" style="font-size: 1.1rem;"></div>
                                </div>
                            </div>
                            
                            <div style="margin-top: 2rem; font-size: 0.8rem; color: var(--text-light);" id="intel-reason"></div>
                        </div>
                        
                        <div id="intel-placeholder" style="text-align: center; color: var(--text-light); margin-top: 4rem;">
                            Select an available seat to view pricing intelligence.
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="maturity-indicator" class="maturity-indicator">
            <div class="maturity-dot"></div>
            <span id="maturity-text">Dataset Maturity: Loading...</span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
